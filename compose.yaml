# Ever Given Pod on a server. See docs/deploy.md.
#
#   cp template.env.docker .env     # then set APP_URL and JWT_SECRET
#   docker compose up -d --build
#
# Optional, switched on with a profile:
#   docker compose --profile caddy up -d      # bundled HTTPS reverse proxy

name: ever-given-pod

services:
  app:
    build:
      context: .
      args:
        # Baked into the browser code by the build. Changing APP_URL means building again.
        NEXT_PUBLIC_API_BASE_URL: "${APP_URL:?Set APP_URL in .env to the address you will open the app at, for example https://pod.example.com}"
    image: ever-given-pod:latest
    # Comes back after a crash and after the server reboots (while Docker itself is enabled).
    restart: unless-stopped
    # A tiny init process, so stop signals reach the server and it exits promptly. It also
    # cleans up after the ffmpeg processes the app starts.
    init: true
    environment:
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env. Generate one with: openssl rand -hex 32}"
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
    ports:
      # Only this machine can reach the port by default; a reverse proxy on the host does
      # the rest. Set APP_BIND=0.0.0.0 in .env to expose it to the network directly.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      # db.json and uploads/. A Docker volume unless DATA_MOUNT in .env names a host folder.
      - ${DATA_MOUNT:-data}:/data
    # Nothing in the image needs to change at runtime: only /data, Next's cache and a
    # scratch /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  # Automatic HTTPS for a domain that points at this server. Skip this if you already run
  # a reverse proxy; point that at 127.0.0.1:3000 instead (see docs/deploy.md).
  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  data:
  caddy_data:
  caddy_config:
